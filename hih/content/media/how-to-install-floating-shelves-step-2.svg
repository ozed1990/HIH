<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Studs behind drywall with bracket">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Find the studs behind the drywall</text><rect x="120" y="160" width="960" height="520" rx="0" fill="none" stroke="#cbd3ce" stroke-width="3"/><rect x="200" y="160" width="50" height="520" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><rect x="440" y="160" width="50" height="520" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><rect x="680" y="160" width="50" height="520" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><rect x="920" y="160" width="50" height="520" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><rect x="180" y="400" width="830" height="34" rx="6" fill="#2e4a40" stroke="none" stroke-width="0"/><circle cx="225" cy="417" r="9" fill="#a8782e"/><circle cx="465" cy="417" r="9" fill="#a8782e"/><circle cx="705" cy="417" r="9" fill="#a8782e"/><circle cx="945" cy="417" r="9" fill="#a8782e"/><rect x="250" y="190" width="190" height="44" rx="0" fill="#ffffff" stroke="none" stroke-width="4"/><line x1="225" y1="245" x2="465" y2="245" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="345" y="222" font-size="26" font-weight="700" fill="#a8782e" text-anchor="middle">16 in on center</text><rect x="900" y="448" width="120" height="40" rx="0" fill="#ffffff" stroke="none" stroke-width="4"/><text x="960" y="476" font-size="26" font-weight="700" fill="#2e4a40" text-anchor="middle">Bracket</text><text x="120" y="760" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">Mark both edges of each stud and confirm with a finish nail.</text><text x="120" y="805" font-size="28" font-weight="600" fill="#6b4a12" text-anchor="start">Avoid drilling straight above or below outlets and switches.</text></g></svg>