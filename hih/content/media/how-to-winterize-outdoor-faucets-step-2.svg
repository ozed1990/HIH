<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Standard versus frost-free outdoor faucet">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Where each faucet type closes</text><rect x="560" y="150" width="80" height="330" rx="0" fill="url(#hatch)" stroke="#5e6863" stroke-width="3"/><text x="600" y="140" font-size="24" font-weight="700" fill="#5e6863" text-anchor="middle">Wall</text><text x="330" y="140" font-size="26" font-weight="700" fill="#1f2a26" text-anchor="middle">Outside (freezing)</text><text x="880" y="140" font-size="26" font-weight="700" fill="#1f2a26" text-anchor="middle">Inside (heated)</text><rect x="440" y="230" width="130" height="40" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="630" y="238" width="440" height="24" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="3"/><circle cx="575" cy="250" r="20" fill="#6b4a12"/><text x="330" y="320" font-size="26" font-weight="700" fill="#6b4a12" text-anchor="middle">Standard: closes here</text><text x="330" y="355" font-size="24" font-weight="500" fill="#5e6863" text-anchor="middle">water sits at the cold wall</text><rect x="440" y="560" width="130" height="40" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="570" y="568" width="260" height="24" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><rect x="830" y="568" width="240" height="24" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="3"/><circle cx="830" cy="580" r="20" fill="#2e4a40"/><rect x="560" y="500" width="80" height="160" rx="0" fill="url(#hatch)" stroke="#5e6863" stroke-width="3"/><text x="330" y="650" font-size="26" font-weight="700" fill="#2e4a40" text-anchor="middle">Frost-free: closes here</text><text x="330" y="685" font-size="24" font-weight="500" fill="#5e6863" text-anchor="middle">long body reaches inside</text><text x="60" y="800" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Either way: disconnect the hose so the faucet body can drain.</text></g></svg>