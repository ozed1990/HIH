<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Circuit breaker ON, tripped and OFF positions">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Reading a breaker</text><rect x="100" y="200" width="160" height="300" rx="10" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><rect x="160" y="230" width="40" height="240" rx="6" fill="#d7dfda" stroke="#cbd3ce" stroke-width="2"/><rect x="140" y="224" width="80" height="52" rx="8" fill="#2e4a40" stroke="#2e4a40" stroke-width="3"/><text x="180" y="540" font-size="28" font-weight="700" fill="#1f2a26" text-anchor="middle">ON</text><rect x="380" y="200" width="160" height="300" rx="10" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><rect x="440" y="230" width="40" height="240" rx="6" fill="#d7dfda" stroke="#cbd3ce" stroke-width="2"/><rect x="420" y="304" width="80" height="52" rx="8" fill="#a8782e" stroke="#2e4a40" stroke-width="3"/><text x="460" y="540" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle">TRIPPED</text><rect x="660" y="200" width="160" height="300" rx="10" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><rect x="720" y="230" width="40" height="240" rx="6" fill="#d7dfda" stroke="#cbd3ce" stroke-width="2"/><rect x="700" y="384" width="80" height="52" rx="8" fill="#2e4a40" stroke="#2e4a40" stroke-width="3"/><text x="740" y="540" font-size="28" font-weight="700" fill="#1f2a26" text-anchor="middle">OFF</text><text x="940" y="260" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="start">To reset:</text><text x="940" y="320" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">1. Push firmly</text><text x="940" y="360" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">    to OFF</text><text x="940" y="420" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">2. Then back</text><text x="940" y="460" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">    to ON</text><path d="M560 330 C620 330 620 410 650 410" fill="none" stroke="#a8782e" stroke-width="5" marker-end="url(#a)"/><text x="60" y="640" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">A tripped handle rests in the middle; some show an orange flag.</text><text x="60" y="684" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">Trips again with nothing plugged in? Leave it off and call an electrician.</text></g></svg>