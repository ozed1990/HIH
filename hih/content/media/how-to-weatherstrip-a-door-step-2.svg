<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Kerf-in versus adhesive weatherstrip">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Know your weatherstrip type</text><rect x="120" y="220" width="160" height="380" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="280" y="300" width="70" height="300" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="340" y="400" width="14" height="50" rx="0" fill="#eef2ef" stroke="none" stroke-width="4"/><path d="M354 410 q60 15 0 35" fill="#a8782e" stroke="#2e4a40" stroke-width="3"/><rect x="420" y="220" width="50" height="380" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="300" y="680" font-size="32" font-weight="700" fill="#2e4a40" text-anchor="middle">Kerf-in</text><text x="300" y="720" font-size="26" font-weight="500" fill="#5e6863" text-anchor="middle">Flange pushes into a slot</text><text x="300" y="755" font-size="26" font-weight="500" fill="#5e6863" text-anchor="middle">in the doorstop. Pulls out.</text><rect x="700" y="220" width="160" height="380" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="860" y="300" width="70" height="300" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="930" y="380" width="28" height="90" rx="0" fill="#a8782e" stroke="#2e4a40" stroke-width="3"/><rect x="1000" y="220" width="50" height="380" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="880" y="680" font-size="32" font-weight="700" fill="#2e4a40" text-anchor="middle">Adhesive foam</text><text x="880" y="720" font-size="26" font-weight="500" fill="#5e6863" text-anchor="middle">Sticks to the face of the stop.</text><text x="880" y="755" font-size="26" font-weight="500" fill="#5e6863" text-anchor="middle">Clean with alcohol first.</text><text x="445" y="200" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">Door</text><text x="1025" y="200" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">Door</text></g></svg>