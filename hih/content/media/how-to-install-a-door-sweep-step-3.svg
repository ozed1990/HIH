<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Door sweep height diagram">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Set the sweep height</text><rect x="420" y="140" width="120" height="560" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="5"/><text x="480" y="130" font-size="26" font-weight="700" fill="#2e4a40" text-anchor="middle">Door</text><rect x="540" y="560" width="40" height="120" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><path d="M560 680 q10 30 30 34" stroke="#a8782e" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="560" cy="590" r="6" fill="#2e4a40"/><circle cx="560" cy="640" r="6" fill="#2e4a40"/><rect x="300" y="712" width="600" height="36" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><text x="600" y="790" font-size="26" font-weight="600" fill="#5e6863" text-anchor="middle">Threshold</text><text x="620" y="600" font-size="28" font-weight="700" fill="#1f2a26" text-anchor="start">Screw-on sweep</text><text x="620" y="640" font-size="24" font-weight="500" fill="#5e6863" text-anchor="start">on the inside face</text><text x="640" y="700" font-size="26" font-weight="700" fill="#a8782e" text-anchor="start">Seal brushes the threshold</text><text x="60" y="860" font-size="26" font-weight="500" fill="#1f2a26" text-anchor="start">Use the slotted holes so you can raise it if the door drags.</text></g></svg>