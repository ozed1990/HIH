<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Ladder 4 to 1 setup">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Set the ladder at 4 to 1</text><rect x="120" y="300" width="360" height="470" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><polygon points="100,300 500,300 300,170" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="480" y="290" width="40" height="26" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="3"/><text x="470" y="340" font-size="24" font-weight="600" fill="#5e6863" text-anchor="end">Gutter</text><line x1="80" y1="770" x2="1120" y2="770" stroke="#2e4a40" stroke-width="4" stroke-linecap="round"/><line x1="640" y1="770" x2="480" y2="200" stroke="#2e4a40" stroke-width="8" stroke-linecap="round"/><line x1="660" y1="770" x2="500" y2="200" stroke="#2e4a40" stroke-width="8" stroke-linecap="round"/><line x1="700" y1="300" x2="700" y2="770" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="720" y="545" font-size="30" font-weight="700" fill="#a8782e" text-anchor="start">4 ft up</text><line x1="490" y1="810" x2="650" y2="810" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="570" y="860" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle">1 ft out</text><line x1="540" y1="300" x2="520" y2="200" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="560" y="225" font-size="26" font-weight="700" fill="#a8782e" text-anchor="start">3 ft above edge</text><text x="560" y="255" font-size="22" font-weight="600" fill="#5e6863" text-anchor="start">(only if stepping off)</text><text x="780" y="420" font-size="26" font-weight="500" fill="#1f2a26" text-anchor="start">Use a stabilizer so the</text><text x="780" y="455" font-size="26" font-weight="500" fill="#1f2a26" text-anchor="start">ladder rests on the wall,</text><text x="780" y="490" font-size="26" font-weight="500" fill="#1f2a26" text-anchor="start">not the gutter.</text></g></svg>