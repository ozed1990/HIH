<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Air filter arrow direction">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Point the arrow toward the furnace</text><rect x="700" y="180" width="300" height="560" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="5"/><text x="850" y="460" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">Furnace /</text><text x="850" y="500" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">air handler</text><rect x="160" y="380" width="470" height="160" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><text x="300" y="580" font-size="26" font-weight="600" fill="#2e4a40" text-anchor="middle">Return duct (from the room)</text><rect x="630" y="360" width="40" height="200" rx="0" fill="#ffffff" stroke="#a8782e" stroke-width="5"/><text x="650" y="600" font-size="26" font-weight="700" fill="#a8782e" text-anchor="middle">Filter</text><path d="M520 300 h300" stroke="#a8782e" stroke-width="6" marker-end="url(#a)"/><text x="670" y="280" font-size="26" font-weight="700" fill="#a8782e" text-anchor="middle">Arrow on filter frame</text><path d="M200 460 h60" stroke="#2e4a40" stroke-width="4" marker-end="url(#p)"/><path d="M360 460 h60" stroke="#2e4a40" stroke-width="4" marker-end="url(#p)"/><path d="M520 460 h60" stroke="#2e4a40" stroke-width="4" marker-end="url(#p)"/><text x="60" y="820" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">Air flows from the room, through the filter, into the furnace.</text></g></svg>