<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Long hinge screw fixing a sagging door">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">A long screw pulls a sagging door back</text><rect x="80" y="160" width="360" height="560" rx="0" fill="none" stroke="#2e4a40" stroke-width="8"/><polygon points="96,176 424,186 424,704 96,704" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><rect x="88" y="230" width="16" height="70" rx="0" fill="#a8782e" stroke="none" stroke-width="4"/><rect x="88" y="600" width="16" height="70" rx="0" fill="#a8782e" stroke="none" stroke-width="4"/><ellipse cx="410" cy="186" rx="40" ry="14" fill="none" stroke="#6b4a12" stroke-width="5"/><text x="300" y="150" font-size="24" font-weight="700" fill="#6b4a12" text-anchor="middle">Rubs here</text><text x="620" y="170" font-size="28" font-weight="700" fill="#2e4a40" text-anchor="start">Top hinge, seen from above</text><rect x="560" y="330" width="560" height="80" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><text x="840" y="380" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">Wall stud (framing)</text><rect x="560" y="250" width="560" height="60" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><text x="840" y="290" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">Door jamb</text><rect x="600" y="230" width="120" height="20" rx="0" fill="#a8782e" stroke="none" stroke-width="4"/><text x="660" y="220" font-size="22" font-weight="700" fill="#a8782e" text-anchor="middle">Hinge</text><line x1="640" y1="240" x2="640" y2="290" stroke="#5e6863" stroke-width="6" stroke-linecap="round"/><text x="600" y="470" font-size="24" font-weight="600" fill="#5e6863" text-anchor="start">Short screw:</text><text x="600" y="500" font-size="24" font-weight="600" fill="#5e6863" text-anchor="start">jamb only</text><line x1="690" y1="240" x2="690" y2="400" stroke="#2e4a40" stroke-width="8" stroke-linecap="round"/><path d="M682 400 L690 418 L698 400 Z" fill="#2e4a40"/><text x="760" y="470" font-size="24" font-weight="700" fill="#2e4a40" text-anchor="start">3-inch screw:</text><text x="760" y="500" font-size="24" font-weight="700" fill="#2e4a40" text-anchor="start">reaches the stud</text><path d="M800 560 C760 520 720 520 700 540" fill="none" stroke="#a8782e" stroke-width="5" marker-end="url(#a)"/><text x="820" y="575" font-size="24" font-weight="600" fill="#1f2a26" text-anchor="start">Pulls the hinge, and the door,</text><text x="820" y="607" font-size="24" font-weight="600" fill="#1f2a26" text-anchor="start">back toward the frame</text><text x="60" y="790" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Replace the screw closest to the doorstop in the top hinge.</text><text x="60" y="834" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">Tighten every hinge screw before you sand or plane.</text></g></svg>