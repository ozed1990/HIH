<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="T-molding, reducer and end cap cross-sections">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Three transition profiles</text><text x="220" y="200" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">T-molding</text><rect x="60" y="520" width="320" height="30" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="3"/><rect x="60" y="470" width="130" height="50" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><text x="125.0" y="560" font-size="22" font-weight="600" fill="#5e6863" text-anchor="middle"></text><rect x="250" y="470" width="130" height="50" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><text x="315.0" y="560" font-size="22" font-weight="600" fill="#5e6863" text-anchor="middle"></text><rect x="205" y="500" width="30" height="20" rx="0" fill="#a8782e" stroke="#2e4a40" stroke-width="2"/><path d="M170 470 H270 V480 H232 V515 H208 V480 H170 Z" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><line x1="60" y1="580" x2="380" y2="580" stroke="#cbd3ce" stroke-width="2" stroke-linecap="round"/><text x="600" y="200" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">Reducer</text><rect x="440" y="520" width="320" height="30" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="3"/><rect x="440" y="470" width="130" height="50" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><text x="505.0" y="560" font-size="22" font-weight="600" fill="#5e6863" text-anchor="middle"></text><rect x="630" y="502" width="130" height="18" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><text x="695.0" y="560" font-size="22" font-weight="600" fill="#5e6863" text-anchor="middle"></text><rect x="585" y="500" width="30" height="20" rx="0" fill="#a8782e" stroke="#2e4a40" stroke-width="2"/><path d="M550 470 H600 L680 500 V502 H612 V515 H588 V480 H550 Z" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><line x1="440" y1="580" x2="760" y2="580" stroke="#cbd3ce" stroke-width="2" stroke-linecap="round"/><text x="980" y="200" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">End cap</text><rect x="820" y="520" width="320" height="30" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="3"/><rect x="820" y="470" width="170" height="50" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><text x="905.0" y="560" font-size="22" font-weight="600" fill="#5e6863" text-anchor="middle"></text><rect x="1010" y="380" width="40" height="140" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="3"/><rect x="995" y="500" width="20" height="20" rx="0" fill="#a8782e" stroke="#2e4a40" stroke-width="2"/><path d="M960 470 H1005 V515 H985 V480 H960 Z" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="1030" y="370" font-size="20" font-weight="600" fill="#5e6863" text-anchor="middle">Door</text><line x1="820" y1="580" x2="1140" y2="580" stroke="#cbd3ce" stroke-width="2" stroke-linecap="round"/><text x="220" y="620" font-size="24" font-weight="600" fill="#1f2a26" text-anchor="middle">Same height on both sides</text><text x="600" y="620" font-size="24" font-weight="600" fill="#1f2a26" text-anchor="middle">Thicker floor to thinner</text><text x="980" y="620" font-size="24" font-weight="600" fill="#1f2a26" text-anchor="middle">Edge against a door</text><text x="60" y="690" font-size="26" font-weight="700" fill="#a8782e" text-anchor="start">Brass = track, fastened to the subfloor in the gap.</text><text x="60" y="760" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Never screw or glue the molding through a floating floor.</text><text x="60" y="804" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">Leave the expansion gap your flooring maker specifies.</text></g></svg>