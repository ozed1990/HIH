<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Raised bed cross-section">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">What goes in the bed</text><rect x="80" y="640" width="1040" height="120" rx="0" fill="url(#hatch)" stroke="#5e6863" stroke-width="3"/><text x="600" y="800" font-size="26" font-weight="600" fill="#5e6863" text-anchor="middle">Native soil (grass skimmed off)</text><rect x="160" y="300" width="60" height="340" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="980" y="300" width="60" height="340" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="220" y="330" width="760" height="300" rx="0" fill="#8a6f4d" stroke="none" stroke-width="4"/><text x="600" y="470" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">~60% topsoil + 40% compost</text><rect x="220" y="620" width="760" height="12" rx="0" fill="#b9a27c" stroke="none" stroke-width="4"/><line x1="220" y1="636" x2="980" y2="636" stroke="#5e6863" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><text x="600" y="590" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Cardboard over hardware cloth (optional)</text><line x1="130" y1="300" x2="130" y2="640" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="115" y="480" font-size="28" font-weight="700" fill="#a8782e" text-anchor="end">11 in</text><line x1="240" y1="300" x2="240" y2="330" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="260" y="290" font-size="26" font-weight="700" fill="#a8782e" text-anchor="start">Fill to 1–2 in below the rim</text></g></svg>