<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Anti-sag cable and brace directions">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Cable pulls, brace pushes</text><rect x="100" y="180" width="60" height="600" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><text x="130" y="170" font-size="22" font-weight="700" fill="#2e4a40" text-anchor="middle">Hinge post</text><rect x="180" y="220" width="440" height="480" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="5"/><rect x="190" y="230" width="420" height="30" rx="0" fill="#d7dfda" stroke="none" stroke-width="4"/><rect x="190" y="660" width="420" height="30" rx="0" fill="#d7dfda" stroke="none" stroke-width="4"/><line x1="200" y1="250" x2="600" y2="680" stroke="#a8782e" stroke-width="6" stroke-linecap="round"/><rect x="385" y="450" width="40" height="16" fill="#2e4a40" transform="rotate(47 405 458)"/><text x="390" y="820" font-size="24" font-weight="700" fill="#a8782e" text-anchor="middle">Cable: top hinge corner → bottom latch</text><rect x="720" y="180" width="60" height="600" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="800" y="220" width="340" height="480" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="5"/><rect x="810" y="230" width="320" height="30" rx="0" fill="#d7dfda" stroke="none" stroke-width="4"/><rect x="810" y="660" width="320" height="30" rx="0" fill="#d7dfda" stroke="none" stroke-width="4"/><polygon points="815,660 845,690 1130,262 1100,232" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><text x="960" y="820" font-size="24" font-weight="700" fill="#2e4a40" text-anchor="middle">Brace: bottom hinge → top latch</text><text x="600" y="870" font-size="24" font-weight="500" fill="#5e6863" text-anchor="middle">Hinges are on the left of each gate.</text></g></svg>