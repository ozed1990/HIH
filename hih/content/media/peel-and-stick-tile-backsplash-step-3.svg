<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Level start line diagram">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Start from a level line, not the counter</text><rect x="120" y="160" width="960" height="470" rx="0" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><rect x="180" y="200" width="220" height="140" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="3"/><rect x="800" y="200" width="220" height="140" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="3"/><text x="290" y="280" font-size="26" font-weight="600" fill="#2e4a40" text-anchor="middle">Cabinet</text><text x="910" y="280" font-size="26" font-weight="600" fill="#2e4a40" text-anchor="middle">Cabinet</text><polygon points="120,630 1080,600 1080,680 120,710" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><text x="600" y="680" font-size="28" font-weight="600" fill="#2e4a40" text-anchor="middle">Countertop (not level)</text><line x1="130" y1="596" x2="1070" y2="596" stroke="#a8782e" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 10"/><text x="140" y="580" font-size="28" font-weight="700" fill="#a8782e" text-anchor="start">Level line</text><line x1="1110" y1="596" x2="1110" y2="628" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="1100" y="560" font-size="28" font-weight="700" fill="#a8782e" text-anchor="end">1/8 in</text><line x1="140" y1="596" x2="140" y2="625" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="140" y="770" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">Measure up 1/8 in from the counter's LOWEST point, then draw level across the wall.</text><text x="140" y="815" font-size="28" font-weight="500" fill="#5e6863" text-anchor="start">Tiles sit on the line; the small gap is caulked at the end.</text></g></svg>