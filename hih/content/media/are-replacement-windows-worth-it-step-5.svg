<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Window energy label explained">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Reading a window's energy label</text><text x="60" y="135" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">Example values. Compare the same four numbers on every quote.</text><rect x="100" y="180" width="470" height="230" rx="10" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="130" y="235" font-size="28" font-weight="700" fill="#2e4a40" text-anchor="start">U-factor</text><text x="130" y="310" font-size="56" font-weight="700" fill="#1f2a26" text-anchor="start">0.27</text><text x="130" y="360" font-size="24" font-weight="600" fill="#5e6863" text-anchor="start">Heat loss through the window</text><text x="540" y="310" font-size="26" font-weight="700" fill="#a8782e" text-anchor="end">Lower = warmer</text><rect x="630" y="180" width="470" height="230" rx="10" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="660" y="235" font-size="28" font-weight="700" fill="#2e4a40" text-anchor="start">Solar heat gain</text><text x="660" y="310" font-size="56" font-weight="700" fill="#1f2a26" text-anchor="start">0.25</text><text x="660" y="360" font-size="24" font-weight="600" fill="#5e6863" text-anchor="start">Sun heat that comes through</text><text x="1070" y="310" font-size="26" font-weight="700" fill="#a8782e" text-anchor="end">Lower = cooler</text><rect x="100" y="450" width="470" height="230" rx="10" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="130" y="505" font-size="28" font-weight="700" fill="#2e4a40" text-anchor="start">Visible light</text><text x="130" y="580" font-size="56" font-weight="700" fill="#1f2a26" text-anchor="start">0.48</text><text x="130" y="630" font-size="24" font-weight="600" fill="#5e6863" text-anchor="start">Daylight that comes through</text><text x="540" y="580" font-size="26" font-weight="700" fill="#a8782e" text-anchor="end">Higher = brighter</text><rect x="630" y="450" width="470" height="230" rx="10" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="660" y="505" font-size="28" font-weight="700" fill="#2e4a40" text-anchor="start">Air leakage</text><text x="660" y="580" font-size="56" font-weight="700" fill="#1f2a26" text-anchor="start">0.1</text><text x="660" y="630" font-size="24" font-weight="600" fill="#5e6863" text-anchor="start">Drafts through the frame</text><text x="1070" y="580" font-size="26" font-weight="700" fill="#a8782e" text-anchor="end">Lower = tighter</text><text x="100" y="760" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Cold climate: focus on a low U-factor.</text><text x="100" y="805" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Hot, sunny climate: focus on a low solar heat gain number.</text><text x="100" y="850" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">Then check ENERGY STAR certification for your climate zone.</text></g></svg>