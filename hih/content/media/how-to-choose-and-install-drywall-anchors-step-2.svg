<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Drywall anchor types by load">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Match the anchor to the load</text><rect x="180" y="180" width="40" height="440" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="200" y="660" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">Light</text><text x="200" y="700" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">plastic expansion</text><rect x="580" y="180" width="40" height="440" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="600" y="660" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">Medium</text><text x="600" y="700" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">self-drilling threaded</text><rect x="980" y="180" width="40" height="440" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="1000" y="660" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">Heavy</text><text x="1000" y="700" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">toggle bolt</text><path d="M120 390 h60 l40 -12 v44 l-40 -12 h-60 z" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><line x1="60" y1="400" x2="230" y2="400" stroke="#a8782e" stroke-width="6" stroke-linecap="round"/><path d="M520 380 h70 v40 h-70 z" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><line x1="590" y1="384" x2="596" y2="416" stroke="#2e4a40" stroke-width="3" stroke-linecap="round"/><line x1="600" y1="384" x2="606" y2="416" stroke="#2e4a40" stroke-width="3" stroke-linecap="round"/><line x1="610" y1="384" x2="616" y2="416" stroke="#2e4a40" stroke-width="3" stroke-linecap="round"/><line x1="460" y1="400" x2="640" y2="400" stroke="#a8782e" stroke-width="6" stroke-linecap="round"/><line x1="860" y1="400" x2="1060" y2="400" stroke="#a8782e" stroke-width="6" stroke-linecap="round"/><rect x="1022" y="300" width="18" height="200" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><text x="60" y="160" font-size="22" font-weight="600" fill="#5e6863" text-anchor="start">Drywall</text><text x="60" y="770" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Use a stud for anything heavy, and always for TV mounts.</text><text x="60" y="814" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">Stay well under the weight rating on the package.</text></g></svg>