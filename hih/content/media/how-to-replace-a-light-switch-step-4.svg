<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Clockwise wire wrap on a terminal screw">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Wrap wires clockwise</text><circle cx="330" cy="400" r="60" fill="#a8782e" stroke="#2e4a40" stroke-width="4"/><path d="M300 400h60M330 370v60" stroke="#2e4a40" stroke-width="6"/><path d="M80 400 L250 400 A82 82 0 1 1 330 482" fill="none" stroke="#2e4a40" stroke-width="12" stroke-linecap="round"/><path d="M420 340 A100 100 0 0 1 380 490" fill="none" stroke="#a8782e" stroke-width="4" marker-end="url(#a)"/><circle cx="330" cy="600" r="26" fill="#2e4a40"/><path d="M318 600l8 9 16-18" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="680" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="middle">Clockwise: tightening pulls</text><text x="330" y="720" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="middle">the loop in</text><circle cx="870" cy="400" r="60" fill="#a8782e" stroke="#2e4a40" stroke-width="4"/><path d="M840 400h60M870 370v60" stroke="#2e4a40" stroke-width="6"/><path d="M1120 400 L950 400 A82 82 0 1 0 870 482" fill="none" stroke="#2e4a40" stroke-width="12" stroke-linecap="round"/><circle cx="870" cy="600" r="26" fill="#6b4a12"/><path d="M860 590l20 20M880 590l-20 20" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><text x="870" y="680" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="middle">Counter-clockwise: tightening</text><text x="870" y="720" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="middle">pushes the wire out</text><text x="100" y="830" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">Insulation should reach close to the screw; no bare copper past the screw head.</text></g></svg>