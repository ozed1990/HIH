<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Smoke alarm placement floor plan">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Where smoke alarms go (one level)</text><rect x="60" y="140" width="1080" height="600" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="5"/><rect x="60" y="140" width="360" height="300" rx="0" fill="none" stroke="#2e4a40" stroke-width="3"/><text x="240" y="290" font-size="26" font-weight="600" fill="#5e6863" text-anchor="middle">Bedroom</text><rect x="420" y="140" width="300" height="300" rx="0" fill="none" stroke="#2e4a40" stroke-width="3"/><text x="570" y="290" font-size="26" font-weight="600" fill="#5e6863" text-anchor="middle">Bedroom</text><rect x="60" y="440" width="660" height="100" rx="0" fill="none" stroke="#2e4a40" stroke-width="3"/><text x="540" y="500" font-size="26" font-weight="600" fill="#5e6863" text-anchor="middle">Hallway</text><rect x="720" y="140" width="420" height="400" rx="0" fill="none" stroke="#2e4a40" stroke-width="3"/><text x="930" y="220" font-size="26" font-weight="600" fill="#5e6863" text-anchor="middle">Kitchen</text><rect x="60" y="540" width="1080" height="200" rx="0" fill="none" stroke="#2e4a40" stroke-width="3"/><text x="400" y="650" font-size="26" font-weight="600" fill="#5e6863" text-anchor="middle">Living room</text><rect x="950" y="300" width="80" height="80" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><text x="990" y="350" font-size="18" font-weight="700" fill="#1f2a26" text-anchor="middle">Stove</text><circle cx="990" cy="340" r="135" fill="none" stroke="#6b4a12" stroke-width="3" stroke-dasharray="10 8"/><text x="740" y="520" font-size="22" font-weight="700" fill="#6b4a12" text-anchor="start">Keep alarms 10 ft from the stove</text><circle cx="240" cy="220" r="22" fill="#ffffff" stroke="#a8782e" stroke-width="6"/><circle cx="240" cy="220" r="6" fill="#a8782e"/><circle cx="570" cy="220" r="22" fill="#ffffff" stroke="#a8782e" stroke-width="6"/><circle cx="570" cy="220" r="6" fill="#a8782e"/><circle cx="230" cy="490" r="22" fill="#ffffff" stroke="#a8782e" stroke-width="6"/><circle cx="230" cy="490" r="6" fill="#a8782e"/><circle cx="760" cy="650" r="22" fill="#ffffff" stroke="#a8782e" stroke-width="6"/><circle cx="760" cy="650" r="6" fill="#a8782e"/><text x="60" y="790" font-size="26" font-weight="700" fill="#1f2a26" text-anchor="start">Alarm in every bedroom, outside each sleeping area, and on every level.</text><text x="60" y="835" font-size="24" font-weight="500" fill="#5e6863" text-anchor="start">Interconnected alarms are best: when one sounds, they all sound.</text></g></svg>