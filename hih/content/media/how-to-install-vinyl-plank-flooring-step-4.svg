<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Expansion gap section">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Leave the expansion gap</text><rect x="120" y="640" width="960" height="70" rx="0" fill="url(#hatch)" stroke="#5e6863" stroke-width="3"/><text x="600" y="760" font-size="28" font-weight="600" fill="#5e6863" text-anchor="middle">Subfloor</text><rect x="160" y="150" width="120" height="490" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><text x="220" y="140" font-size="28" font-weight="700" fill="#2e4a40" text-anchor="middle">Wall</text><rect x="280" y="470" width="46" height="170" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="340" y="400" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Baseboard</text><rect x="310" y="600" width="770" height="40" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><text x="700" y="590" font-size="28" font-weight="600" fill="#2e4a40" text-anchor="middle">Vinyl plank (floating)</text><line x1="280" y1="560" x2="310" y2="560" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><line x1="320" y1="555" x2="420" y2="500" stroke="#a8782e" stroke-width="2" stroke-linecap="round"/><text x="430" y="505" font-size="28" font-weight="700" fill="#a8782e" text-anchor="start">~1/4 in gap</text><text x="120" y="830" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">Nail trim into the wall, never into the floor, so the floor can move.</text></g></svg>