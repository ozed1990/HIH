<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Thread tape wrap direction">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Wrap thread tape clockwise</text><rect x="140" y="380" width="520" height="90" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="5"/><text x="300" y="520" font-size="26" font-weight="600" fill="#5e6863" text-anchor="middle">Shower arm (from wall)</text><line x1="660" y1="372" x2="674" y2="478" stroke="#2e4a40" stroke-width="4" stroke-linecap="round"/><line x1="688" y1="372" x2="702" y2="478" stroke="#2e4a40" stroke-width="4" stroke-linecap="round"/><line x1="716" y1="372" x2="730" y2="478" stroke="#2e4a40" stroke-width="4" stroke-linecap="round"/><line x1="744" y1="372" x2="758" y2="478" stroke="#2e4a40" stroke-width="4" stroke-linecap="round"/><line x1="772" y1="372" x2="786" y2="478" stroke="#2e4a40" stroke-width="4" stroke-linecap="round"/><line x1="800" y1="372" x2="814" y2="478" stroke="#2e4a40" stroke-width="4" stroke-linecap="round"/><rect x="660" y="380" width="170" height="90" rx="0" fill="none" stroke="#2e4a40" stroke-width="4"/><path d="M700 360 a70 70 0 1 1 -10 140" fill="none" stroke="#a8782e" stroke-width="5" marker-end="url(#a)"/><text x="880" y="300" font-size="26" font-weight="700" fill="#1f2a26" text-anchor="start">3–4 wraps</text><circle cx="1000" cy="470" r="70" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><circle cx="1000" cy="470" r="26" fill="#eef2ef" stroke="#2e4a40" stroke-width="3"/><path d="M1000 380 a90 90 0 0 1 88 108" fill="none" stroke="#a8782e" stroke-width="6" marker-end="url(#a)"/><text x="1000" y="590" font-size="24" font-weight="700" fill="#a8782e" text-anchor="middle">End view: clockwise</text><text x="140" y="680" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">Wrapping this way means screwing the head on tightens the tape</text><text x="140" y="720" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">instead of peeling it off.</text></g></svg>