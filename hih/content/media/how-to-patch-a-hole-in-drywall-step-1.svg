<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Drywall repair methods by hole size">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Match the method to the hole</text><rect x="80" y="160" width="320" height="560" rx="0" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><circle cx="240" cy="330" r="14" fill="#ffffff" stroke="#2e4a40" stroke-width="4" stroke-dasharray="6 6"/><text x="240" y="470" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">Up to 1/2 in</text><text x="240" y="520" font-size="26" font-weight="500" fill="#5e6863" text-anchor="middle">Nails, screws,</text><text x="240" y="555" font-size="26" font-weight="500" fill="#5e6863" text-anchor="middle">anchors</text><text x="240" y="640" font-size="32" font-weight="700" fill="#a8782e" text-anchor="middle">Spackle</text><rect x="440" y="160" width="320" height="560" rx="0" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><rect x="520" y="250" width="160" height="160" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="3"/><circle cx="600" cy="330" r="48" fill="#ffffff" stroke="#2e4a40" stroke-width="4" stroke-dasharray="6 6"/><text x="600" y="470" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">1/2 in to 4 in</text><text x="600" y="520" font-size="26" font-weight="500" fill="#5e6863" text-anchor="middle">Doorknobs, dings</text><text x="600" y="640" font-size="32" font-weight="700" fill="#a8782e" text-anchor="middle">Mesh patch</text><rect x="800" y="160" width="320" height="560" rx="0" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><rect x="880" y="240" width="160" height="180" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><circle cx="960" cy="330" r="72" fill="#ffffff" stroke="#2e4a40" stroke-width="4" stroke-dasharray="6 6"/><text x="960" y="470" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">Over 4 in</text><text x="960" y="520" font-size="26" font-weight="500" fill="#5e6863" text-anchor="middle">Big holes</text><text x="960" y="640" font-size="32" font-weight="700" fill="#a8782e" text-anchor="middle">Drywall piece</text><text x="80" y="800" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">Every method finishes the same way: thin coats, feathered wide, then prime.</text></g></svg>