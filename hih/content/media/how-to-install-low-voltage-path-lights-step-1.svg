<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Low-voltage path light layout">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Path light layout</text><rect x="60" y="150" width="1080" height="70" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><text x="600" y="195" font-size="26" font-weight="600" fill="#2e4a40" text-anchor="middle">House wall</text><rect x="140" y="230" width="60" height="60" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="170" y="270" font-size="18" font-weight="700" fill="#1f2a26" text-anchor="middle">GFCI</text><rect x="220" y="230" width="90" height="70" rx="0" fill="#a8782e" stroke="#2e4a40" stroke-width="4"/><text x="325" y="275" font-size="22" font-weight="700" fill="#a8782e" text-anchor="start">Transformer</text><path d="M260 380 C420 420 520 560 640 600 S900 640 1120 560" fill="none" stroke="#d7dfda" stroke-width="110" stroke-linecap="round"/><path d="M265 300 L265 330 C300 470 470 500 600 520 S900 560 1120 480" fill="none" stroke="#2e4a40" stroke-width="4" stroke-dasharray="14 10"/><circle cx="380" cy="470" r="18" fill="#ffffff" stroke="#a8782e" stroke-width="6"/><circle cx="560" cy="650" r="18" fill="#ffffff" stroke="#a8782e" stroke-width="6"/><circle cx="720" cy="545" r="18" fill="#ffffff" stroke="#a8782e" stroke-width="6"/><circle cx="900" cy="680" r="18" fill="#ffffff" stroke="#a8782e" stroke-width="6"/><circle cx="1060" cy="520" r="18" fill="#ffffff" stroke="#a8782e" stroke-width="6"/><line x1="380" y1="760" x2="560" y2="760" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="470" y="745" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle">8–10 ft</text><text x="640" y="610" font-size="26" font-weight="700" fill="#2e4a40" text-anchor="middle">Path</text><line x1="600" y1="520" x2="760" y2="440" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><circle cx="600" cy="520" r="6" fill="#2e4a40"/><text x="770" y="450" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Cable along the path edge</text><text x="60" y="850" font-size="24" font-weight="600" fill="#1f2a26" text-anchor="start">Stagger lights on alternate sides. Keep the load under about 80% of the transformer rating.</text></g></svg>