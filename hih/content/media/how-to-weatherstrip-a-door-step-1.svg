<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Door air leak zones">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Where doors usually leak</text><rect x="380" y="140" width="440" height="640" rx="0" fill="none" stroke="#2e4a40" stroke-width="10"/><rect x="400" y="160" width="400" height="610" rx="0" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><circle cx="760" cy="470" r="14" fill="#2e4a40"/><rect x="780" y="200" width="24" height="540" rx="0" fill="#a8782e" stroke="none" stroke-width="4"/><rect x="395" y="150" width="410" height="22" rx="0" fill="#a8782e" stroke="none" stroke-width="4"/><rect x="400" y="752" width="400" height="22" rx="0" fill="#a8782e" stroke="none" stroke-width="4"/><text x="850" y="470" font-size="30" font-weight="700" fill="#1f2a26" text-anchor="start">Latch side</text><text x="850" y="510" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">(most common)</text><text x="600" y="125" font-size="30" font-weight="700" fill="#1f2a26" text-anchor="middle">Top + corners</text><text x="600" y="830" font-size="30" font-weight="700" fill="#1f2a26" text-anchor="middle">Bottom: sweep and threshold</text><text x="100" y="300" font-size="28" font-weight="700" fill="#2e4a40" text-anchor="start">Paper test:</text><text x="100" y="340" font-size="26" font-weight="500" fill="#1f2a26" text-anchor="start">close the door on</text><text x="100" y="375" font-size="26" font-weight="500" fill="#1f2a26" text-anchor="start">a sheet of paper.</text><text x="100" y="410" font-size="26" font-weight="500" fill="#1f2a26" text-anchor="start">Slides out easily?</text><text x="100" y="445" font-size="26" font-weight="500" fill="#1f2a26" text-anchor="start">Seal is too weak.</text></g></svg>