<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Raised bed reach plan">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">4 ft wide = everything in reach</text><rect x="160" y="260" width="880" height="440" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="8"/><rect x="160" y="260" width="880" height="220" rx="0" fill="none" stroke="none" stroke-width="4"/><line x1="170" y1="480" x2="1030" y2="480" stroke="#a8782e" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 10"/><text x="600" y="380" font-size="28" font-weight="600" fill="#2e4a40" text-anchor="middle">Reach from this side</text><text x="600" y="600" font-size="28" font-weight="600" fill="#2e4a40" text-anchor="middle">Reach from this side</text><line x1="160" y1="220" x2="1040" y2="220" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="600" y="205" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle">8 ft</text><line x1="1080" y1="260" x2="1080" y2="700" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="1095" y="490" font-size="30" font-weight="700" fill="#a8782e" text-anchor="start">4 ft</text><line x1="120" y1="260" x2="120" y2="480" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="105" y="380" font-size="28" font-weight="700" fill="#a8782e" text-anchor="end">2 ft</text><text x="160" y="790" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">Leave about 2 ft of path around the bed. Pick a spot with 6–8 hours of sun.</text></g></svg>