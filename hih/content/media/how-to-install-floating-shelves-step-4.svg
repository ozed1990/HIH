<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Floating shelf bracket into stud">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Let the studs carry the load</text><rect x="240" y="150" width="100" height="600" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><text x="290" y="140" font-size="26" font-weight="700" fill="#2e4a40" text-anchor="middle">Stud</text><rect x="340" y="150" width="30" height="600" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="3"/><text x="355" y="790" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">Drywall</text><rect x="370" y="390" width="24" height="90" rx="0" fill="#2e4a40" stroke="none" stroke-width="4"/><line x1="260" y1="435" x2="394" y2="435" stroke="#a8782e" stroke-width="8" stroke-linecap="round"/><text x="150" y="430" font-size="26" font-weight="700" fill="#a8782e" text-anchor="end">Screw</text><rect x="394" y="410" width="400" height="16" rx="4" fill="#2e4a40" stroke="none" stroke-width="0"/><rect x="394" y="450" width="400" height="16" rx="4" fill="#2e4a40" stroke="none" stroke-width="0"/><rect x="400" y="380" width="520" height="110" rx="6" fill="none" stroke="#a8782e" stroke-width="4"/><text x="660" y="360" font-size="26" font-weight="600" fill="#1f2a26" text-anchor="middle">Shelf slides over the rods</text><path d="M700 520 v100" stroke="#2e4a40" stroke-width="4" marker-end="url(#p)"/><text x="720" y="600" font-size="26" font-weight="600" fill="#2e4a40" text-anchor="start">Load</text><text x="140" y="860" font-size="26" font-weight="500" fill="#1f2a26" text-anchor="start">Anchors only where no stud lands, rated for the load. Never the plastic plugs in the box.</text></g></svg>