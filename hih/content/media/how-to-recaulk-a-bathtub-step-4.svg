<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Taped caulk joint diagram">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Tape both sides of the joint</text><rect x="200" y="150" width="160" height="520" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><text x="280" y="140" font-size="28" font-weight="700" fill="#2e4a40" text-anchor="middle">Wall tile</text><path d="M200 670 L200 700 Q200 760 260 760 L1000 760 L1000 690 L380 690 Q370 690 370 680" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="700" y="740" font-size="28" font-weight="700" fill="#2e4a40" text-anchor="middle">Tub rim</text><rect x="360" y="300" width="14" height="360" rx="0" fill="#a8782e" stroke="none" stroke-width="4"/><text x="390" y="330" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Tape on wall</text><rect x="420" y="676" width="300" height="14" rx="0" fill="#a8782e" stroke="none" stroke-width="4"/><text x="560" y="650" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="middle">Tape on tub</text><line x1="360" y1="600" x2="360" y2="676" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><line x1="360" y1="640" x2="420" y2="640" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="480" y="590" font-size="28" font-weight="700" fill="#a8782e" text-anchor="start">~1/4 in bead</text><text x="200" y="840" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">Tape sets the bead width. Pull it while the silicone is still wet.</text></g></svg>