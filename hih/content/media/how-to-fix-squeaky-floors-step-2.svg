<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Squeaky floor screw into joist">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Pull the subfloor tight to the joist</text><rect x="100" y="300" width="1000" height="40" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="3"/><text x="1090" y="290" font-size="24" font-weight="600" fill="#5e6863" text-anchor="end">Carpet or hardwood</text><rect x="100" y="340" width="1000" height="50" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><text x="1090" y="420" font-size="24" font-weight="600" fill="#5e6863" text-anchor="end">Subfloor</text><rect x="200" y="390" width="60" height="260" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><rect x="520" y="390" width="60" height="260" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><rect x="840" y="390" width="60" height="260" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="550" y="700" font-size="26" font-weight="700" fill="#2e4a40" text-anchor="middle">Joists</text><line x1="550" y1="250" x2="550" y2="520" stroke="#a8782e" stroke-width="8" stroke-linecap="round"/><path d="M538 250 h24" stroke="#a8782e" stroke-width="8"/><text x="580" y="240" font-size="26" font-weight="700" fill="#a8782e" text-anchor="start">Breakaway screw</text><line x1="230" y1="760" x2="550" y2="760" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="390" y="745" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle">16 in on center</text><text x="100" y="850" font-size="26" font-weight="500" fill="#1f2a26" text-anchor="start">Tap the floor: it sounds solid over a joist and hollow between.</text></g></svg>