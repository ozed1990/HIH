<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Foam pipe sleeve sizing and mitered elbow">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Size the sleeve to the pipe, miter the elbows</text><rect x="60" y="140" width="500" height="600" rx="0" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><text x="310" y="190" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">1. Match the size</text><circle cx="190" cy="360" r="56" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><circle cx="190" cy="360" r="22" fill="#a8782e" stroke="#2e4a40" stroke-width="3"/><text x="190" y="462" font-size="26" font-weight="700" fill="#1f2a26" text-anchor="middle">1/2 in pipe</text><text x="190" y="498" font-size="24" font-weight="500" fill="#5e6863" text-anchor="middle">1/2 in sleeve</text><circle cx="430" cy="360" r="64" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><circle cx="430" cy="360" r="30" fill="#a8782e" stroke="#2e4a40" stroke-width="3"/><text x="430" y="470" font-size="26" font-weight="700" fill="#1f2a26" text-anchor="middle">3/4 in pipe</text><text x="430" y="506" font-size="24" font-weight="500" fill="#5e6863" text-anchor="middle">3/4 in sleeve</text><text x="310" y="600" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">Pipe (brass) fits snugly</text><text x="310" y="636" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">inside the foam (green).</text><rect x="620" y="140" width="520" height="600" rx="0" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><text x="880" y="190" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">2. Cut 45° at elbows</text><path d="M700 640 L860 640 L860 300" fill="none" stroke="#a8782e" stroke-width="22" stroke-linejoin="miter"/><polygon points="680,612 830,612 888,670 680,670" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><polygon points="832,612 832,260 888,260 888,670" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><line x1="832" y1="612" x2="888" y2="670" stroke="#2e4a40" stroke-width="5" stroke-linecap="round"/><rect x="808" y="590" width="104" height="104" fill="none" stroke="#a8782e" stroke-width="4" stroke-dasharray="10 8" rx="10"/><line x1="912" y1="640" x2="960" y2="560" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><circle cx="912" cy="640" r="6" fill="#2e4a40"/><text x="970" y="570" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Tape the joint</text><line x1="888" y1="400" x2="960" y2="400" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><circle cx="888" cy="400" r="6" fill="#2e4a40"/><text x="970" y="410" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">No bare pipe</text><text x="60" y="810" font-size="26" font-weight="600" fill="#1f2a26" text-anchor="start">Insulate cold lines and hot lines. Press the self-seal edges closed along the full length.</text></g></svg>