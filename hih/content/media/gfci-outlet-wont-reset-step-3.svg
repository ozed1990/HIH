<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="GFCI upstream protection">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">One GFCI can protect other rooms</text><rect x="100" y="340" width="220" height="260" rx="16" fill="#ffffff" stroke="#2e4a40" stroke-width="5"/><text x="210" y="320" font-size="26" font-weight="700" fill="#2e4a40" text-anchor="middle">GFCI (garage)</text><rect x="150" y="400" width="120" height="40" rx="6" fill="#a8782e" stroke="none" stroke-width="0"/><text x="210" y="428" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">RESET</text><rect x="150" y="460" width="120" height="40" rx="6" fill="#d7dfda" stroke="#2e4a40" stroke-width="2"/><text x="210" y="488" font-size="20" font-weight="700" fill="#2e4a40" text-anchor="middle">TEST</text><rect x="430" y="380" width="160" height="200" rx="14" fill="#ffffff" stroke="#5e6863" stroke-width="3"/><text x="510" y="360" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">Outdoor</text><rect x="660" y="380" width="160" height="200" rx="14" fill="#ffffff" stroke="#5e6863" stroke-width="3"/><text x="740" y="360" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">Bathroom 2</text><rect x="890" y="380" width="160" height="200" rx="14" fill="#ffffff" stroke="#5e6863" stroke-width="3"/><text x="970" y="360" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">Garage wall</text><line x1="320" y1="480" x2="430" y2="480" stroke="#2e4a40" stroke-width="5" stroke-linecap="round"/><line x1="590" y1="480" x2="660" y2="480" stroke="#2e4a40" stroke-width="5" stroke-linecap="round"/><line x1="820" y1="480" x2="890" y2="480" stroke="#2e4a40" stroke-width="5" stroke-linecap="round"/><text x="100" y="700" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">If any of these outlets is dead, reset the GFCI upstream first.</text><text x="100" y="745" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">Check every GFCI: bathrooms, kitchen, garage, basement, outside.</text></g></svg>