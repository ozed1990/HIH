<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Nail pop screw placement">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Lock the panel to the stud</text><rect x="500" y="140" width="200" height="640" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><text x="600" y="130" font-size="26" font-weight="700" fill="#2e4a40" text-anchor="middle">Stud (behind drywall)</text><circle cx="600" cy="460" r="22" fill="#ffffff" stroke="#6b4a12" stroke-width="5"/><text x="740" y="470" font-size="28" font-weight="700" fill="#6b4a12" text-anchor="start">Popped nail: set it</text><circle cx="600" cy="340" r="14" fill="#2e4a40"/><circle cx="600" cy="580" r="14" fill="#2e4a40"/><text x="740" y="350" font-size="28" font-weight="700" fill="#1f2a26" text-anchor="start">New screw</text><text x="740" y="590" font-size="28" font-weight="700" fill="#1f2a26" text-anchor="start">New screw</text><line x1="460" y1="340" x2="460" y2="460" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="440" y="410" font-size="28" font-weight="700" fill="#a8782e" text-anchor="end">1½ in</text><line x1="460" y1="460" x2="460" y2="580" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="440" y="530" font-size="28" font-weight="700" fill="#a8782e" text-anchor="end">1½ in</text><text x="60" y="850" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">Press the drywall tight, then dimple each screw just below the surface.</text></g></svg>