<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Feathered joint compound coats">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Wider and thinner with every coat</text><rect x="80" y="520" width="1040" height="80" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><text x="600" y="650" font-size="28" font-weight="600" fill="#5e6863" text-anchor="middle">Wall</text><rect x="520" y="500" width="160" height="20" rx="0" fill="#2e4a40" stroke="none" stroke-width="4"/><text x="600" y="480" font-size="26" font-weight="700" fill="#2e4a40" text-anchor="middle">Patch</text><path d="M420 520 Q600 488 780 520" fill="none" stroke="#a8782e" stroke-width="5"/><text x="600" y="430" font-size="26" font-weight="600" fill="#1f2a26" text-anchor="middle">Coat 1: about 6 in</text><path d="M300 520 Q600 470 900 520" fill="none" stroke="#a8782e" stroke-width="5" stroke-dasharray="14 8"/><text x="600" y="380" font-size="26" font-weight="600" fill="#1f2a26" text-anchor="middle">Coat 2: about 10 in</text><path d="M160 520 Q600 455 1040 520" fill="none" stroke="#a8782e" stroke-width="5" stroke-dasharray="4 8"/><text x="600" y="330" font-size="26" font-weight="600" fill="#1f2a26" text-anchor="middle">Coat 3: about 14 in</text><text x="80" y="760" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">Let each coat dry fully. Press the knife edges hard so the coat fades to nothing.</text></g></svg>