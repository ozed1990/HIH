<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Paint quantity calculation example">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">How much paint? A worked example</text><text x="60" y="140" font-size="28" font-weight="500" fill="#5e6863" text-anchor="start">12 x 12 ft room, 8 ft ceiling, 1 door, 1 window, 2 coats</text><rect x="60" y="180" width="1080" height="90" rx="10" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><text x="90" y="237" font-size="30" font-weight="600" fill="#1f2a26" text-anchor="start">Wall area: 4 walls x 12 ft x 8 ft</text><text x="1110" y="237" font-size="32" font-weight="700" fill="#1f2a26" text-anchor="end">384 sq ft</text><rect x="60" y="290" width="1080" height="90" rx="10" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><text x="90" y="347" font-size="30" font-weight="600" fill="#1f2a26" text-anchor="start">Minus 1 door (20) and 1 window (15)</text><text x="1110" y="347" font-size="32" font-weight="700" fill="#1f2a26" text-anchor="end">349 sq ft</text><rect x="60" y="400" width="1080" height="90" rx="10" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><text x="90" y="457" font-size="30" font-weight="600" fill="#1f2a26" text-anchor="start">Two coats: 349 x 2</text><text x="1110" y="457" font-size="32" font-weight="700" fill="#1f2a26" text-anchor="end">698 sq ft</text><rect x="60" y="510" width="1080" height="90" rx="10" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><text x="90" y="567" font-size="30" font-weight="600" fill="#1f2a26" text-anchor="start">Divide by 350 sq ft per gallon</text><text x="1110" y="567" font-size="32" font-weight="700" fill="#1f2a26" text-anchor="end">2.0 gallons</text><rect x="60" y="620" width="1080" height="90" rx="10" fill="#d7dfda" stroke="#2e4a40" stroke-width="3"/><text x="90" y="677" font-size="30" font-weight="600" fill="#1f2a26" text-anchor="start">Buy</text><text x="1110" y="677" font-size="32" font-weight="700" fill="#2e4a40" text-anchor="end">2 gallons</text><text x="60" y="770" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Use 350 sq ft per gallon to be safe; labels often say 350–400.</text><text x="60" y="814" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">Bare drywall, textured walls and dark colors need more.</text></g></svg>