<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Pop-up sink drain parts">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Parts of a pop-up sink drain</text><path d="M120 170 H760 Q740 330 440 330 Q140 330 120 170 Z" fill="#ffffff" stroke="#2e4a40" stroke-width="5"/><rect x="415" y="300" width="50" height="300" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><path d="M405 240 h70 v24 h-70 z" fill="#a8782e" stroke="#2e4a40" stroke-width="3"/><line x1="440" y1="264" x2="440" y2="470" stroke="#a8782e" stroke-width="6" stroke-linecap="round"/><line x1="440" y1="470" x2="640" y2="470" stroke="#2e4a40" stroke-width="6" stroke-linecap="round"/><rect x="452" y="456" width="40" height="28" rx="4" fill="#a8782e" stroke="#2e4a40" stroke-width="3"/><rect x="632" y="300" width="14" height="300" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="3"/><line x1="560" y1="200" x2="560" y2="150" stroke="#5e6863" stroke-width="6" stroke-linecap="round"/><line x1="560" y1="200" x2="610" y2="310" stroke="#5e6863" stroke-width="4" stroke-linecap="round"/><path d="M415 600 v60 a70 70 0 0 0 140 0 v-30 h220" fill="none" stroke="#2e4a40" stroke-width="36" stroke-linejoin="round"/><line x1="440" y1="252" x2="820" y2="220" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><circle cx="440" cy="252" r="6" fill="#2e4a40"/><text x="830" y="230" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Stopper</text><line x1="472" y1="470" x2="820" y2="430" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><circle cx="472" cy="470" r="6" fill="#2e4a40"/><text x="830" y="440" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Pivot nut + rod</text><line x1="639" y1="380" x2="820" y2="330" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><circle cx="639" cy="380" r="6" fill="#2e4a40"/><text x="830" y="340" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Lift strap</text><line x1="485" y1="700" x2="820" y2="650" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><circle cx="485" cy="700" r="6" fill="#2e4a40"/><text x="830" y="660" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">P-trap</text><text x="60" y="770" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Hair usually wraps around the stopper's post.</text><text x="60" y="814" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">Loosen the pivot nut to lift the stopper out.</text></g></svg>