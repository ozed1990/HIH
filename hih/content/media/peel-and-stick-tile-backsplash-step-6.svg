<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Outlet cutout diagram">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Cutting around an outlet</text><rect x="160" y="170" width="420" height="560" rx="0" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><text x="370" y="210" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">1. Mark</text><rect x="250" y="300" width="240" height="300" rx="8" fill="url(#hatch)" stroke="#5e6863" stroke-width="3"/><rect x="290" y="340" width="160" height="220" rx="6" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><line x1="300" y1="350" x2="440" y2="350" stroke="#a8782e" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><line x1="300" y1="550" x2="440" y2="550" stroke="#a8782e" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><line x1="300" y1="350" x2="300" y2="550" stroke="#a8782e" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><line x1="440" y1="350" x2="440" y2="550" stroke="#a8782e" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><text x="370" y="660" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">Cut ~1/16 in inside the box outline</text><rect x="640" y="170" width="420" height="560" rx="0" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><text x="850" y="210" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">2. Cover</text><rect x="720" y="280" width="260" height="340" rx="14" fill="#ffffff" stroke="#2e4a40" stroke-width="5"/><rect x="800" y="340" width="100" height="70" rx="10" fill="#eef2ef" stroke="#2e4a40" stroke-width="3"/><rect x="800" y="480" width="100" height="70" rx="10" fill="#eef2ef" stroke="#2e4a40" stroke-width="3"/><circle cx="850" cy="450" r="9" fill="#2e4a40"/><text x="850" y="660" font-size="24" font-weight="600" fill="#5e6863" text-anchor="middle">Cover plate hides every cut edge</text><text x="160" y="800" font-size="28" font-weight="600" fill="#6b4a12" text-anchor="start">Power off at the breaker and verified dead before you remove the cover.</text></g></svg>