<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Toilet tank anatomy">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Inside the toilet tank</text><path d="M260 170 L940 170 L920 720 Q920 760 880 760 L320 760 Q280 760 280 720z" fill="#ffffff" stroke="#2e4a40" stroke-width="5"/><rect x="284" y="330" width="632" height="425" rx="0" fill="#d7dfda" stroke="none" stroke-width="4"/><line x1="284" y1="330" x2="916" y2="330" stroke="#2e4a40" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 8"/><rect x="360" y="230" width="34" height="520" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><rect x="340" y="380" width="74" height="80" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><text x="220" y="260" font-size="28" font-weight="700" fill="#1f2a26" text-anchor="end">Fill valve</text><line x1="230" y1="252" x2="356" y2="252" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><text x="220" y="425" font-size="28" font-weight="700" fill="#1f2a26" text-anchor="end">Float</text><line x1="230" y1="418" x2="336" y2="418" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><rect x="600" y="300" width="40" height="400" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="960" y="300" font-size="28" font-weight="700" fill="#1f2a26" text-anchor="start">Overflow tube</text><line x1="645" y1="292" x2="952" y2="292" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><ellipse cx="660" cy="712" rx="90" ry="22" fill="#2e4a40"/><text x="960" y="720" font-size="28" font-weight="700" fill="#1f2a26" text-anchor="start">Flapper</text><line x1="752" y1="712" x2="952" y2="712" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><line x1="800" y1="230" x2="740" y2="690" stroke="#5e6863" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/><rect x="760" y="210" width="140" height="20" rx="6" fill="#2e4a40" stroke="none" stroke-width="0"/><text x="830" y="200" font-size="22" font-weight="600" fill="#5e6863" text-anchor="middle">Handle lever</text><text x="960" y="520" font-size="28" font-weight="700" fill="#1f2a26" text-anchor="start">Chain</text><text x="960" y="556" font-size="24" font-weight="600" fill="#5e6863" text-anchor="start">~1/2 in slack</text><line x1="775" y1="520" x2="952" y2="512" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><line x1="660" y1="300" x2="660" y2="330" stroke="#a8782e" stroke-width="3" stroke-linecap="round" marker-start="url(#a)" marker-end="url(#a)"/><text x="0" y="0" font-size="28" font-weight="700" fill="#a8782e" text-anchor="middle"></text><text x="960" y="345" font-size="26" font-weight="700" fill="#a8782e" text-anchor="start">Water line ~1 in</text><text x="960" y="380" font-size="26" font-weight="700" fill="#a8782e" text-anchor="start">below tube top</text></g></svg>