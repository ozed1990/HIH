<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Ball valve and gate valve shut-off directions">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Which way is off?</text><text x="300" y="170" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">Ball valve (lever)</text><text x="900" y="170" font-size="30" font-weight="700" fill="#2e4a40" text-anchor="middle">Gate valve (wheel)</text><rect x="80" y="330" width="440" height="50" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="250" y="300" width="100" height="110" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><line x1="300" y1="300" x2="300" y2="270" stroke="#2e4a40" stroke-width="8" stroke-linecap="round"/><rect x="290" y="255" width="170" height="26" rx="6" fill="#a8782e" stroke="#2e4a40" stroke-width="3"/><text x="300" y="450" font-size="26" font-weight="600" fill="#1f2a26" text-anchor="middle">ON: lever along the pipe</text><rect x="80" y="640" width="440" height="50" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="250" y="610" width="100" height="110" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><line x1="300" y1="610" x2="300" y2="590" stroke="#2e4a40" stroke-width="8" stroke-linecap="round"/><rect x="287" y="490" width="26" height="110" rx="6" fill="#a8782e" stroke="#2e4a40" stroke-width="3"/><text x="300" y="760" font-size="26" font-weight="700" fill="#2e4a40" text-anchor="middle">OFF: lever across the pipe</text><rect x="680" y="450" width="440" height="50" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="850" y="400" width="100" height="150" rx="0" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><line x1="900" y1="400" x2="900" y2="330" stroke="#2e4a40" stroke-width="8" stroke-linecap="round"/><circle cx="900" cy="300" r="90" fill="none" stroke="#a8782e" stroke-width="14"/><line x1="810" y1="300" x2="990" y2="300" stroke="#a8782e" stroke-width="8" stroke-linecap="round"/><line x1="900" y1="210" x2="900" y2="390" stroke="#a8782e" stroke-width="8" stroke-linecap="round"/><path d="M960 190 A120 120 0 0 1 1020 300" fill="none" stroke="#2e4a40" stroke-width="6" marker-end="url(#p)"/><text x="900" y="600" font-size="26" font-weight="700" fill="#2e4a40" text-anchor="middle">Turn clockwise until it stops</text><text x="60" y="820" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Don't force a stuck valve. Old gate valves can break.</text><text x="60" y="864" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">Test it: close it and check that a faucet stops running.</text></g></svg>