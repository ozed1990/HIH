<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Garbage disposal hex socket and reset button">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Underside of a garbage disposal</text><circle cx="430" cy="430" r="260" fill="#d7dfda" stroke="#2e4a40" stroke-width="6"/><circle cx="430" cy="430" r="200" fill="none" stroke="#c9d4cd" stroke-width="4" stroke-dasharray="10 10"/><polygon points="464.0,430.0 447.0,459.4 413.0,459.4 396.0,430.0 413.0,400.6 447.0,400.6" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><path d="M430 430 L430 300 L520 300" fill="none" stroke="#a8782e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="560" width="44" height="44" rx="6" fill="#a8782e" stroke="#2e4a40" stroke-width="4"/><path d="M230 600 q-60 90 -150 110" fill="none" stroke="#5e6863" stroke-width="10" stroke-linecap="round"/><line x1="430" y1="430" x2="760" y2="360" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><circle cx="430" cy="430" r="6" fill="#2e4a40"/><text x="770" y="370" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Hex socket (1/4 in)</text><line x1="530" y1="300" x2="760" y2="260" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><circle cx="530" cy="300" r="6" fill="#2e4a40"/><text x="770" y="270" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Wrench: crank both ways</text><line x1="582" y1="582" x2="760" y2="560" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><circle cx="582" cy="582" r="6" fill="#2e4a40"/><text x="770" y="570" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Reset button</text><line x1="120" y1="690" x2="760" y2="660" stroke="#5e6863" stroke-width="2" stroke-linecap="round"/><circle cx="120" cy="690" r="6" fill="#2e4a40"/><text x="770" y="670" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Power cord: unplug first</text><text x="60" y="770" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Turn the wrench until it spins in full circles.</text><text x="60" y="814" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">If the reset button pops back out, wait about 10 minutes.</text></g></svg>