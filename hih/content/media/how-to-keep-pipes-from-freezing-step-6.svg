<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Cold-night checklist to prevent frozen pipes">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Nights at 20°F or colder: four quick moves</text><rect x="60" y="145" width="500" height="260" rx="14" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><circle cx="170" cy="275" r="60" fill="#d7dfda" stroke="#2e4a40" stroke-width="5"/><text x="170" y="287" font-size="34" font-weight="700" fill="#2e4a40" text-anchor="middle">55°</text><text x="260" y="255" font-size="32" font-weight="700" fill="#2e4a40" text-anchor="start">Thermostat 55°F+</text><text x="260" y="305" font-size="24" font-weight="500" fill="#5e6863" text-anchor="start">Same day and night</text><rect x="640" y="145" width="500" height="260" rx="14" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><path d="M700 230 h80 v40" fill="none" stroke="#2e4a40" stroke-width="14" stroke-linecap="round"/><circle cx="780" cy="300" r="7" fill="#a8782e"/><circle cx="780" cy="325" r="7" fill="#a8782e"/><circle cx="780" cy="350" r="7" fill="#a8782e"/><text x="840" y="255" font-size="32" font-weight="700" fill="#2e4a40" text-anchor="start">Drip one faucet</text><text x="840" y="305" font-size="24" font-weight="500" fill="#5e6863" text-anchor="start">Farthest from the main</text><rect x="60" y="445" width="500" height="260" rx="14" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><rect x="120" y="520" width="100" height="130" rx="6" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><path d="M120 520 L80 540 L80 670 L120 650" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><line x1="150" y1="560" x2="190" y2="560" stroke="#a8782e" stroke-width="6" stroke-linecap="round"/><text x="260" y="555" font-size="32" font-weight="700" fill="#2e4a40" text-anchor="start">Open cabinets</text><text x="260" y="605" font-size="24" font-weight="500" fill="#5e6863" text-anchor="start">Sinks on outside walls</text><rect x="640" y="445" width="500" height="260" rx="14" fill="#ffffff" stroke="#cbd3ce" stroke-width="3"/><rect x="690" y="520" width="120" height="110" rx="4" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><line x1="700" y1="545" x2="800" y2="545" stroke="#2e4a40" stroke-width="3" stroke-linecap="round"/><line x1="700" y1="570" x2="800" y2="570" stroke="#2e4a40" stroke-width="3" stroke-linecap="round"/><line x1="700" y1="595" x2="800" y2="595" stroke="#2e4a40" stroke-width="3" stroke-linecap="round"/><polygon points="680,520 750,480 820,520" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><text x="840" y="555" font-size="32" font-weight="700" fill="#2e4a40" text-anchor="start">Close the garage</text><text x="840" y="605" font-size="24" font-weight="500" fill="#5e6863" text-anchor="start">If pipes run through it</text><text x="60" y="790" font-size="26" font-weight="600" fill="#1f2a26" text-anchor="start">A slow, steady drip is enough. Wind makes pipes freeze faster, so start early.</text><text x="60" y="835" font-size="24" font-weight="500" fill="#5e6863" text-anchor="start">Away from home? Keep the heat on and ask someone to check the house.</text></g></svg>