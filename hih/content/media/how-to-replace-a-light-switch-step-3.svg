<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Single-pole switch terminals">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Single-pole switch terminals</text><rect x="470" y="140" width="260" height="620" rx="16" fill="#ffffff" stroke="#2e4a40" stroke-width="5"/><rect x="555" y="360" width="90" height="180" rx="10" fill="#d7dfda" stroke="#2e4a40" stroke-width="4"/><text x="600" y="330" font-size="24" font-weight="700" fill="#5e6863" text-anchor="middle">OFF</text><text x="600" y="580" font-size="24" font-weight="700" fill="#5e6863" text-anchor="middle">ON</text><circle cx="730" cy="300" r="26" fill="#a8782e" stroke="#2e4a40" stroke-width="3"/><circle cx="730" cy="600" r="26" fill="#a8782e" stroke="#2e4a40" stroke-width="3"/><circle cx="470" cy="690" r="24" fill="#3f7a4a" stroke="#2e4a40" stroke-width="3"/><text x="790" y="290" font-size="30" font-weight="700" fill="#1f2a26" text-anchor="start">Brass terminal</text><text x="790" y="330" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">hot wire (either one)</text><text x="790" y="590" font-size="30" font-weight="700" fill="#1f2a26" text-anchor="start">Brass terminal</text><text x="790" y="630" font-size="26" font-weight="500" fill="#5e6863" text-anchor="start">hot wire (either one)</text><text x="420" y="680" font-size="30" font-weight="700" fill="#1f2a26" text-anchor="end">Green screw</text><text x="420" y="720" font-size="26" font-weight="500" fill="#5e6863" text-anchor="end">bare copper ground</text><text x="100" y="830" font-size="28" font-weight="600" fill="#6b4a12" text-anchor="start">Three or more terminals besides ground? It's a 3-way or 4-way switch. Stop here.</text></g></svg>