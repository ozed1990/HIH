<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Concave versus bulging caulk bead">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8782e"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e4a40"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cbd3ce" stroke-width="4"/></pattern></defs>
<rect width="1200" height="900" fill="#eef2ef"/>
<g font-family="Manrope, sans-serif" fill="#1f2a26"><text x="60" y="90" font-size="40" font-weight="700" fill="#2e4a40" text-anchor="start">Tool the bead into a slight curve</text><rect x="140" y="200" width="60" height="380" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="140" y="580" width="400" height="60" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><path d="M200 470 L200 580 L310 580 Q215 565 200 470z" fill="#a8782e"/><circle cx="400" cy="300" r="26" fill="#2e4a40"/><path d="M388 300l8 9 16-18" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="380" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Concave: sheds water,</text><text x="340" y="420" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">bonds both faces</text><rect x="660" y="200" width="60" height="380" rx="0" fill="#c9d4cd" stroke="#2e4a40" stroke-width="4"/><rect x="660" y="580" width="400" height="60" rx="0" fill="#ffffff" stroke="#2e4a40" stroke-width="4"/><path d="M720 470 Q830 470 830 580 L720 580z" fill="#a8782e"/><circle cx="920" cy="300" r="26" fill="#6b4a12"/><path d="M910 290l20 20M930 290l-20 20" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><text x="860" y="380" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">Bulging: traps water,</text><text x="860" y="420" font-size="28" font-weight="600" fill="#1f2a26" text-anchor="start">peels at the edges</text><text x="140" y="760" font-size="28" font-weight="500" fill="#1f2a26" text-anchor="start">One smooth pass with a wet fingertip or finishing tool per section.</text></g></svg>